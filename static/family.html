<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <title>Kavach Family View</title>
  <meta name="description" content="Watch a loved one's call live and get alerted the moment Kavach detects a scam.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a78bfa' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kavach.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3z"/></svg>
      <div>Kavach Family<small>Watch over a loved one's call</small></div>
    </div>
    <span class="pill" id="status"><span class="dot"></span><span id="status-text">Not connected</span></span>
    <div class="spacer"></div>
    <a class="icon-btn" href="./">Kavach app</a>
  </header>

  <main class="wrap">
    <section class="join card" id="join">
      <h2 style="margin:0">Enter the family code</h2>
      <p class="sub" style="color:var(--muted)">It's shown at the top of Kavach on your parent's phone.</p>
      <form id="join-form">
        <input id="code-input" maxlength="5" autocomplete="off" placeholder="ABCDE" aria-label="Family code">
        <button class="go" style="margin:0;width:100%">Watch live</button>
      </form>
    </section>

    <div class="hidden" id="watching">
      <div class="family-banner">
        <span style="font-size:30px">👵</span>
        <div><div class="who">Amma's call</div><div style="color:var(--muted);font-size:14px">Family code <b id="code"></b> · you'll be alerted if it turns into a scam</div></div>
        <div class="spacer"></div>
        <button class="icon-btn" id="sound-btn">🔔 Enable alert sound</button>
      </div>
      <div id="dashboard"></div>
    </div>
  </main>

  <script type="module" src="js/family.js"></script>
</body>
</html>
