<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f2">
  <title>Kavach — Scam Call Shield</title>
  <meta name="description" content="Kavach listens to a phone call live and warns elders the moment it turns into a scam, in their own language. Built on Sarvam AI.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2313773c' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kavach.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3z"/></svg>
      <div><h1>Kavach</h1><small>Live scam-call shield</small></div>
    </div>
    <span class="pill" id="status"><span class="dot"></span><span id="status-text">Ready</span></span>
    <div class="spacer"></div>
    <button class="code-badge hidden" id="share-btn" title="Let family watch this call live">Family code <b id="code"></b></button>
    <a class="icon-btn" href="family.html" target="_blank" rel="noopener">Family view</a>
    <button class="icon-btn" id="history-btn">History</button>
  </header>

  <main class="wrap">
    <div class="controls">
      <div class="field">
        <label for="lang">Warn me in</label>
        <select id="lang"></select>
      </div>
      <div class="field">
        <label>Listen to</label>
        <div class="seg" id="source">
          <button data-src="mic" class="on">Live call</button>
          <button data-src="demo">Demo call</button>
        </div>
      </div>
      <div class="field hidden" id="demo-field">
        <label for="demo">Demo call</label>
        <select id="demo">
          <option value="digital_arrest_hinglish">“Digital arrest” · Hinglish</option>
          <option value="kyc_tamil">Fake bank KYC · Tamil</option>
          <option value="customs_english">Customs parcel · English</option>
          <option value="safe_grandson">Grandson calling · safe</option>
        </select>
      </div>
      <button class="go" id="go">Start listening</button>
    </div>

    <div id="dashboard"></div>

    <section class="history hidden" id="history">
      <div class="card">
        <h3>Recent calls <span class="tag">saved on this device only</span></h3>
        <div id="history-list"></div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
